# LLMwiki — Nginx / 宝塔 反代配置
# 把整段粘到宝塔 → 网站 → llmwiki → 配置文件 (server { ... } 块内)
#
# 前置条件：
#   - 前端构建产物: /www/wwwroot/llmwiki/dist/
#   - 后端 uvicorn 监听: 127.0.0.1:8000
#   - systemd 服务: llmwiki-backend.service (见 deploy/systemd/)
#   - 宝塔已签发 SSL 证书 (或使用 CF 反代)
#
# SSE 关键: proxy_buffering off + 长 timeout

# 上游（可省略，直接用 127.0.0.1:8000）
# upstream llmwiki_backend {
#     server 127.0.0.1:8000;
#     keepalive 16;
# }

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name llmwiki.example.com;  # ← 改成你的域名

    # SSL 证书（宝塔自动生成或 Let's Encrypt）
    ssl_certificate     /www/server/panel/vhost/cert/llmwiki.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/llmwiki.example.com/privkey.pem;

    # 静态资源
    root /www/wwwroot/llmwiki/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # 安全头（简单版）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ===========================================================
    # API 反代（核心：SSE 必须关 buffering + 长 timeout）
    # ===========================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;

        # 禁用 nginx 缓冲 (StreamResponse 配 X-Accel-Buffering: no 同步生效)
        add_header X-Accel-Buffering no;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏敏感路径
    location ~ /\.(env|git|svn) { deny all; }
}
