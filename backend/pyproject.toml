[project]
name = "llmwiki-backend"
version = "0.1.0"
description = "FastAPI backend exposing the 政策 Obsidian vault to a web chat UI."
requires-python = ">=3.11"
authors = [
    { name = "石先生" }
]
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "anthropic==0.39.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "ruamel.yaml==0.18.6",
    "aiofiles==23.2.1",
    "rapidfuzz==3.9.4",
    "httpx==0.27.0",
    "watchfiles==0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ----- Pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ----- Ruff (optional, lightweight linter) -----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is enforced separately

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # allow `from app.foo import bar` in tests
